[build]
  publish   = "."
  command   = "node scripts/build-config.js"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # These values are public by design (they end up in config.js), so Netlify's secret scan must ignore them
  SECRETS_SCAN_OMIT_KEYS = "SB_URL,SB_KEY,ADMIN_MAIL,ORG_NAME,DEVELOPERS,APK_URL"
