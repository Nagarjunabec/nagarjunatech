<body><script>try{var c=localStorage.ng_sbc;if(c=='1'||(c==null&&innerWidth<1100))document.documentElement.classList.add('sbc')}catch(e){}</script>
<div class="shell">
  <aside class="side" id="side"><div class="brand"><img src="assets/logo-sm.webp" width="42" height="42" alt=""><div class="bt"><b>Nagarjuna</b><span>Tech Academy</span></div></div><div class="menu-sk"><div class="sk-s"></div><div class="sk-s"></div><div class="sk-s"></div><div class="sk-s"></div><div class="sk-s"></div></div></aside>

<script src="shell.js?v=47"></script>
<script>
/* ---- small calendar (dots = a notice / lab is dated that day) ---- */
function calendar(el, events, show) {
  const now = new Date(); let y = now.getFullYear(), m = now.getMonth(), sel = null;
  const key = (a, b, c) => a + '-' + String(b + 1).padStart(2, '0') + '-' + String(c).padStart(2, '0');
  const by = {}; events.forEach(e => { const k = String(e.date).slice(0, 10); (by[k] = by[k] || []).push(e); });
  const tk = key(now.getFullYear(), now.getMonth(), now.getDate()); sel = tk;
  function draw() {
    const first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
    let h = '<div class="cal-h"><button class="cal-b" id="cp" aria-label="Previous month">‹</button><b>' +
      new Date(y, m, 1).toLocaleDateString('en-IN', { month: 'long', year: 'numeric' }) +
      '</b><button class="cal-b" id="cn" aria-label="Next month">›</button></div><div class="cal-g">' +
      ['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(x => '<i class="dow">' + x + '</i>').join('');
    for (let i = 0; i < first; i++) h += '<i></i>';
    for (let i = 1; i <= days; i++) { const k = key(y, m, i);
      h += '<button class="cal-d' + (k == tk ? ' today' : '') + (by[k] ? ' has' : '') + (k == sel ? ' sel' : '') + '" data-k="' + k + '">' + i + '</button>'; }
    el.innerHTML = h + '</div>';
    $('#cp').onclick = () => { if (--m < 0) { m = 11; y--; } draw(); };
    $('#cn').onclick = () => { if (++m > 11) { m = 0; y++; } draw(); };
    el.querySelectorAll('.cal-d').forEach(b => b.onclick = () => { sel = b.dataset.k; draw(); });
    show(sel, by[sel] || []);
  }
  draw();
}

let clockTimer;
function clock(el) {
  clearInterval(clockTimer);
  const t = () => { const n = new Date();
    el.innerHTML = '<b>' + n.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) + '</b><span>' +
      n.toLocaleDateString('en-IN', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' }) + '</span>'; };
  t(); clockTimer = setInterval(t, 1000);
}

/* draws the whole dashboard from  d = the dashboard data  and  subs = the subject list */
function render(d, subs) {
  const sum = k => subs.reduce((a, s) => a + Number(s[k]), 0);
  /* every card is a link: admin -> the page that manages it, student / CR -> the subject (or the subject list when there are several) */
  const one = subs.length == 1 ? subs[0].code : null;
  const toSub = tab => one ? subUrl(one, tab) : '#subs';
  const card = (cls, icon, n, label, href) => '<a class="stat" href="' + href + '"><span class="bub ' + cls + '">' + ico(icon) + '</span><div><b>' + n + '</b><span>' + label + '</span></div></a>';
  const st = d.stats;
  const cards = ROLE == 'admin'
    ? card('', 'layers', st.subjects, 'Subjects', page('subjects')) + card('g', 'users', st.students, 'Students', page('students')) + card('y', 'shield', st.crs, 'CRs', page('subjects')) +
      card('', 'book', st.materials, 'Materials & marks', page('subjects')) + card('g', 'flask', st.labs, 'Lab programs', page('subjects')) + card('', 'layers', st.videos, 'Video lessons', page('subjects')) + card('y', 'bell', st.notices, 'Notices', page('subjects')) +
      card(st.emails_failed ? 'r' : 'g', 'mail', st.emails_sent, 'Emails sent' + (st.emails_failed ? ' · ' + st.emails_failed + ' failed' : ''), page('email'))
    : card('', 'layers', subs.length, 'My subjects', '#subs') + card('', 'book', sum('materials'), 'Materials & marks', toSub('materials')) + (subs.some(s => s.kind == 'lab') ? card('g', 'flask', sum('labs'), 'Lab programs', toSub('labs')) : '') +
      card('', 'layers', sum('videos'), 'Video lessons', toSub('videos')) + card('y', 'bell', sum('notices'), 'Notices', toSub('notices'));

  const today = new Date().toISOString().slice(0, 10);
  const up = d.events.filter(e => String(e.date).slice(0, 10) >= today).slice(0, 8);
  const hr = new Date().getHours(), hi = hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Good evening';

  $('#main').innerHTML =
    '<div class="hero"><div><h2>' + hi + ', ' + esc(String(localStorage.ng_name || '').split(' ')[0] || 'there') + '</h2><p>' + esc(localStorage.ng_sub || '') + '</p></div><div id="clk" class="clock"></div></div>' +
    '<div class="stats">' + cards + '</div>' +
    '<div class="dgrid" style="margin-top:18px">' +
      '<div class="card"><div id="cal"></div></div>' +
      '<div class="stack-col"><div class="card"><h3 id="dayh">Today</h3><div id="dayl"></div></div>' +
        '<div class="card"><h3>Coming up</h3>' + (up.map(e => evRow(e, true)).join('') || '<p class="sm">Nothing scheduled.</p>') + '</div></div>' +
    '</div>' +
    '<h3 id="subs" style="margin-top:26px">' + (ROLE == 'admin' ? 'All subjects' : 'My subjects') + '</h3>' +
    '<div class="grid">' + (subs.map(s =>
      '<a class="card click" href="' + subUrl(s.code) + '"><div class="sc-top"><span class="pill' + (s.kind == 'lab' ? ' ok' : '') + '">' + (s.kind == 'lab' ? 'Theory + Lab' : 'Theory only') + '</span><span class="sm">' + s.students + ' students</span></div>' +
      '<h3 class="sc-code">' + esc(s.code) + '</h3>' + (s.full_name ? '<p class="sm">' + esc(s.full_name) + '</p>' : '') +
      '<div class="sc-meta"><span><b>' + s.materials + '</b> files</span>' + (s.kind == 'lab' ? '<span><b>' + s.labs + '</b> labs</span>' : '') + '<span><b>' + s.videos + '</b> videos</span><span><b>' + s.notices + '</b> notices</span></div></a>').join('') ||
      '<p class="sm">' + (ROLE == 'admin' ? 'No subjects yet.</p><p><a class="btn y" href="' + page('subjects') + '">Create subject</a>' : 'No subject has been assigned to you yet.') + '</p>') + '</div>';

  clock($('#clk'));
  calendar($('#cal'), d.events, (k, list) => {
    $('#dayh').textContent = k == today ? 'Today' : fmtDate(k);
    $('#dayl').innerHTML = list.map(e => evRow(e)).join('') || '<p class="sm">Nothing on this date.</p>';
  });
}

if (needLogin()) (async () => {
  buildShell('dash');
  /* returning visitor: draw the last seen dashboard at once, then refresh it from the database */
  const cs = cachedSubs(), cd = cget('dash');
  if (cs && cd) render(cd, cs);
  const [d, subs] = await Promise.all([T('dashboard'), SUBS]);
  cset('dash', d);
  if (!(cs && cd) || JSON.stringify([cd, cs]) !== JSON.stringify([d, subs])) render(d, subs);
})().catch(e => toast(e.message, 1));

function evRow(e, withDate) {
  return '<div class="ev"><span class="pill ' + (e.kind == 'Lab' ? 'ok' : 'wait') + '">' + e.kind + '</span> <b>' + esc(e.title) + '</b> <span class="sm">· ' + esc(e.code) + (withDate ? ' · ' + fmtDate(e.date) : '') + (e.time ? ' · ' + fmtTime(e.time) : '') + '</span></div>';
}
</script>
